version: "3.8"

services:
  api:
    build: .
    container_name: fastapi_container
    restart: always
    env_file:
      - .env
    depends_on:
      - mysql
    volumes:
      - .:/app
    ports:
      - "${API_PORT}:8000"
    networks:
      - app_network

  mysql:
    image: mysql:8.4.0
    container_name: mysql_db_container
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASS}
      MYSQL_DATABASE: ${DB_NAME}
    ports:
      - "${DB_PORT}:3306"
    volumes:
      - db_data:/var/lib/mysql
    networks:
      - app_network

  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    container_name: phpmyadmin_ui_container
    restart: always
    environment:
      PMA_HOST: mysql
      MYSQL_ROOT_PASSWORD: ${DB_PASS}
    ports:
      - "${PMA_PORT}:80"
    depends_on:
      - mysql
    networks:
      - app_network

  apache:
    image: httpd:2.4
    container_name: apache_proxy_container
    restart: always
    ports:
      - "${APACHE_PORT}:80"
    volumes:
      - ./apache/httpd.conf:/usr/local/apache2/conf/httpd.conf
    depends_on:
      - api
    networks:
      - app_network

networks:
  app_network:
    driver: bridge

volumes:
  db_data:
